name: 推送更新到搜索引擎

on:
  workflow_dispatch:  # 手动触发

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: 构建站点(生成最新 sitemap)
        run: hugo --minify

      - name: 恢复上次的 sitemap 记录
        uses: actions/cache/restore@v4
        with:
          path: last-sitemap.xml
          key: sitemap-cache-v1
          restore-keys: |
            sitemap-cache-v1

      - name: 对比新旧 sitemap,找出新增与修改的 URL
        id: diff
        run: |
          NEW="public/sitemap.xml"
          OLD="last-sitemap.xml"

          # 提取 <url> 里的 <loc> 和 <lastmod> 并拼接成 "URL|LASTMOD" 格式进行排序保存
          python3 -c "
          import xml.etree.ElementTree as ET
          import os

          def parse_sitemap(file_path, out_file):
              if not os.path.exists(file_path):
                  open(out_file, 'w').close()
                  return
              try:
                  tree = ET.parse(file_path)
                  root = tree.getroot()
                  ns = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
                  records = []
                  for url in root.findall('sm:url', ns):
                      loc = url.find('sm:loc', ns)
                      lastmod = url.find('sm:lastmod', ns)
                      loc_txt = loc.text.strip() if loc is not None and loc.text else ''
                      mod_txt = lastmod.text.strip() if lastmod is not None and lastmod.text else ''
                      if loc_txt:
                          records.append(f'{loc_txt}|{mod_txt}')
                  records.sort()
                  with open(out_file, 'w') as f:
                      for r in records:
                          f.write(r + '\n')
              except Exception as e:
                  print(f'解析 XML 失败: {e}')
                  open(out_file, 'w').close()

          parse_sitemap('$NEW', 'new_entries.txt')
          parse_sitemap('$OLD', 'old_entries.txt')
          "

          # 找出 new_entries 中有但 old_entries 中没有的记录（包含新增 URL 或修改了 lastmod 的 URL）
          comm -13 old_entries.txt new_entries.txt > changed_entries.txt

          # 提取出纯 URL
          cut -d'|' -f1 changed_entries.txt | sort -u > changed_urls.txt

          COUNT=$(wc -l < changed_urls.txt)
          echo "发现 $COUNT 个新增/修改的网页 URL"
          cat changed_urls.txt

      - name: 推送到 IndexNow(必应/Yandex等)
        if: success()
        run: |
          if [ -s changed_urls.txt ]; then
            URLS=$(cat changed_urls.txt | jq -R . | jq -s .)
            curl -X POST "https://api.indexnow.org/indexnow" \
                 -H "Content-Type: application/json" \
                 -d "{\"host\":\"1001k.com\",\"key\":\"hugo2026cfIndexNowKey8x3qz9m\",\"keyLocation\":\"https://1001k.com/hugo2026cfIndexNowKey8x3qz9m.txt\",\"urlList\":$URLS}"
          else
            echo "没有变更,跳过推送"
          fi

      - name: 保存本次 sitemap,供下次对比
        run: cp public/sitemap.xml last-sitemap.xml

      - name: 更新缓存
        uses: actions/cache/save@v4
        with:
          path: last-sitemap.xml
          key: sitemap-cache-v1-${{ github.run_id }}