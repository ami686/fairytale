name: 推送更新到搜索引擎

on:
  workflow_dispatch:  # 只能手动触发
    inputs:
      dry_run:
        description: '仅预览(勾选=只看变更列表,不实际推送;不勾选=正式推送)'
        required: true
        type: boolean
        default: true

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: 构建站点(生成最新 sitemap)
        run: hugo --minify

      - name: 恢复上次的 sitemap 记录
        uses: actions/cache/restore@v4
        with:
          path: last-sitemap.xml
          key: sitemap-cache-v1
          restore-keys: sitemap-cache-v1

      - name: 对比新旧 sitemap,找出变更 URL(含内容更新)
        id: diff
        run: |
          NEW=public/sitemap.xml
          OLD=last-sitemap.xml

          # 提取 "url|lastmod" 格式,一行代表一篇文章的当前状态
          # 这样不仅能发现新增的 URL,也能发现同一个 URL 但 lastmod 变了(即内容被修改过)的情况
          extract_url_lastmod() {
            awk '
              /<loc>/ { gsub(/<\/?loc>/, ""); loc=$0 }
              /<lastmod>/ { gsub(/<\/?lastmod>/, ""); lastmod=$0; print loc"|"lastmod }
            ' "$1" | sort
          }

          extract_url_lastmod "$NEW" > new_urls.txt

          if [ -f "$OLD" ]; then
            extract_url_lastmod "$OLD" > old_urls.txt
          else
            touch old_urls.txt
          fi

          # 找出新增的行,以及 lastmod 发生变化的行
          comm -13 old_urls.txt new_urls.txt > changed_lines.txt

          # 从变更行里只取出 URL 部分,供后面推送使用
          cut -d'|' -f1 changed_lines.txt | sort -u > changed_urls.txt

          COUNT=$(wc -l < changed_urls.txt)
          echo "================================"
          echo "发现 $COUNT 个变更(含新增文章和内容更新)"
          echo "================================"
          cat changed_urls.txt
          echo "================================"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "当前是【仅预览】模式,以上是本次会被推送的 URL 列表。"
            echo "确认无误后,请重新手动触发一次本 workflow,并把 dry_run 取消勾选,才会真正推送。"
          fi

      - name: 推送到 IndexNow(必应/Yandex等)
        if: ${{ success() && inputs.dry_run == false }}
        run: |
          if [ -s changed_urls.txt ]; then
            URLS=$(cat changed_urls.txt | jq -R . | jq -s .)
            curl -X POST "https://api.indexnow.org/indexnow" \
              -H "Content-Type: application/json" \
              -d "{\"host\":\"1001k.com\",\"key\":\"hugo2026cfIndexNowKey8x3qz9m\",\"keyLocation\":\"https://1001k.com/hugo2026cfIndexNowKey8x3qz9m.txt\",\"urlList\":$URLS}"
          else
            echo "没有变更,跳过推送"
          fi

      - name: Ping Google(提醒它来重新抓取 sitemap)
        if: ${{ success() && inputs.dry_run == false }}
        run: |
          curl -s "https://www.google.com/ping?sitemap=https://1001k.com/sitemap.xml"
          echo "已 ping Google"

      - name: 保存本次 sitemap,供下次对比(仅预览模式不保存,避免影响下次真实对比)
        if: ${{ inputs.dry_run == false }}
        run: cp public/sitemap.xml last-sitemap.xml

      - name: 更新缓存(仅预览模式不更新)
        if: ${{ inputs.dry_run == false }}
        uses: actions/cache/save@v4
        with:
          path: last-sitemap.xml
          key: sitemap-cache-v1-${{ github.run_id }}
